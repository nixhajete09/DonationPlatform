services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: donationplatform-web
    env_file:
      - .env
    environment:
      RACK_ENV: development
      PORT: 4567
      DATABASE_URL: sqlite://db/donation_platform.db
      SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@donation.local}
      SESSION_SECRET: ${SESSION_SECRET:-donation_platform_docker_dev_session_secret}
    ports:
      - "4567:4567"
    volumes:
      - ./db:/app/db
      - ./tmp:/app/tmp
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: donationplatform-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped
