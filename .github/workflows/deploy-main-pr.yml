name: Build And Deploy On PR To Main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/donationplatform
          IMAGE_TAG=${{ github.sha }}
          echo "image_ref=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_name }}:latest

  deploy_to_vm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            IMAGE_REF="${{ needs.build_and_push.outputs.image_ref }}"
            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            GHCR_PAT="${{ secrets.GHCR_PAT }}"
            SMTP_ADDRESS="${{ secrets.SMTP_ADDRESS }}"
            SMTP_PORT="${{ secrets.SMTP_PORT }}"
            SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}"
            SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
            MAIL_FROM="${{ secrets.MAIL_FROM }}"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker er ikke installeret pa VM."
              exit 1
            fi

            sudo mkdir -p /opt/donationplatform/db

            # Build runtime env file on the VM from GitHub Secrets.
            sudo tee /opt/donationplatform/.env.production > /dev/null <<EOF
            RACK_ENV=production
            PORT=4567
            DATABASE_URL=sqlite://db/donation_platform.db
            SMTP_ADDRESS=${SMTP_ADDRESS}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USERNAME=${SMTP_USERNAME}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            MAIL_FROM=${MAIL_FROM}
            EOF

            echo "$GHCR_PAT" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            sudo docker pull "$IMAGE_REF"

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^donationplatform$'; then
              sudo docker stop donationplatform || true
              sudo docker rm donationplatform || true
            fi

            sudo docker run -d \
              --name donationplatform \
              --restart unless-stopped \
              -p 4567:4567 \
              --env-file /opt/donationplatform/.env.production \
              -v /opt/donationplatform/db:/app/db \
              "$IMAGE_REF"

            sudo docker image prune -f
